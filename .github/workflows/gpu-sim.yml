name: GPU tests (simulated)

# Optional, non-required check. The runners have no GPU, so this runs the tests
# on a simulated NVIDIA H100 (https://github.com/pantheongpu/pantheonsim).
# A simulator cannot reproduce hardware-specific behaviour or timing, so it
# complements real-GPU testing and does not replace it. It only runs when
# started by hand (Actions > Run workflow), since the job is long.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gpu-tests:
    name: ctest on a simulated H100
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up the simulated GPU and CUDA toolkit
        uses: pantheongpu/setup-pantheonsim@dda0c8df8d72627c295edbae525354ba2bcb1687 # v0.1.4
        with:
          gpu: nvidia/h100
          cuda-toolkit: "13.0"

      - name: Configure
        run: |
          # 80-virtual embeds PTX only: the simulator JIT-compiles PTX and does not run SASS.
          cmake -B build -DCUDAWRAPPERS_BUILD_TESTING=True \
            -DCUDAWRAPPERS_COMPONENTS='cu;cufft;nvrtc' \
            -DCMAKE_CUDA_ARCHITECTURES=80-virtual \
            -DCMAKE_CUDA_RUNTIME_LIBRARY=Shared

      # Catch2 test discovery runs the test binaries during the build.
      - name: Build
        run: vgpu run --preload cmake --build build -j

      # Green contexts are not supported by the simulator, and the 2D FFT test
      # returns NaN on the simulated cuFFT.
      - name: Test
        run: vgpu run ctest --test-dir build --output-on-failure -E 'GreenContext|2D FFT'

      - name: Free disk space
        if: always()
        run: rm -rf build
